[package]
name = "dsh-powerdesk-pty"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust PTY native module (napi-rs + portable-pty) for the dsh-powerdesk DSH plugin."
publish = false

[lib]
name = "dsh_powerdesk_pty"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"
portable-pty = "0.8"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
